[project]
name = "voice-pipeline"
version = "0.1.0"
description = "Pipecat side of the voice agent: LLM, tools, pipeline. Separate from the root project because pipecat-ai pins onnxruntime~=1.24 and soundfile~=0.13, which the speech side must not take."
requires-python = ">=3.12,<3.14"
dependencies = [
    "pipecat-ai[google,mcp,openai]==1.13.0",
    "httpx>=0.27",
    "mcp-server-time==2026.10.19",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_pipeline"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
warn_unused_ignores = false
mypy_path = "src"
packages = ["voice_pipeline"]

[[tool.mypy.overrides]]
module = ["pipecat", "pipecat.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
