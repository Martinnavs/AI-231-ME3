[project]
name = "voice-agent"
version = "0.1.0"
description = "Full-duplex voice agent on a Raspberry Pi"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mcp>=1.2,<2",
    "numpy>=2.5.4",
    "python-dotenv>=1.0",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8"]
laptop = [
    "cmudict>=1.1.3",
    "kokoro-onnx>=0.6.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.11",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "rank-bm25>=0.2.2",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core==1.13.8",
    "sounddevice>=0.5.6",
    "tokenizers>=0.21",
    "supertonic>=1.3.1",
    "websockets>=17.2",
    "fastmcp==2.14.7",
    "livekit>=1.1,<2",
    "numba>=0.68.1",
]

# Raspberry Pi: only what scripts/pi_echo_check.py needs (the base dependencies + these). The Pi runs
# no speech model; the Silero VAD file is in assets/. Install with: uv sync --group pi --no-group dev
pi = [
    "onnxruntime>=1.18",
    "sounddevice>=0.5.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent", "src/audio_engine", "src/bench", "src/lan_speech", "src/doc_chat"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
warn_unused_ignores = false
mypy_path = "src"
packages = ["voice_agent", "audio_engine", "bench", "lan_speech", "doc_chat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: calls paid or authenticated APIs (needs VOICE_AGENT_LIVE=1)",
  "pi: needs a real Raspberry Pi (needs VOICE_AGENT_PI=1)",
]

[[tool.mypy.overrides]]
module = [
    "soundfile",
    "scipy.*",
    "sherpa_onnx",
    "sherpa_onnx.*",
    "supertonic",
    "supertonic.*",
    "kokoro_onnx",
    "kokoro_onnx.*",
    "onnxruntime",
    "onnxruntime.*",
    "websockets",
    "websockets.*",
    "sounddevice",
    "sounddevice.*",
    "rank_bm25",
    "rank_bm25.*",
    "langchain_community.*",
    "langchain_core",
    "langchain_core.*",
    "langchain_text_splitters",
    "langchain_text_splitters.*",
    "langchain_openai",
    "langchain_openai.*",
]
ignore_missing_imports = true
