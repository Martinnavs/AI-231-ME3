[project]
name = "voice-agent"
version = "0.1.0"
description = "Full-duplex voice agent on a Raspberry Pi"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.5.4",
    "python-dotenv>=1.0",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent", "src/audio_engine", "src/bench"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["voice_agent", "audio_engine", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: calls paid or authenticated APIs (needs VOICE_AGENT_LIVE=1)",
  "pi: needs a real Raspberry Pi (needs VOICE_AGENT_PI=1)",
]

[[tool.mypy.overrides]]
module = ["soundfile", "scipy.*"]
ignore_missing_imports = true
