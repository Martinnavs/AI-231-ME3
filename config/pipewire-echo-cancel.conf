# WebRTC echo cancellation as a stand-alone PipeWire client (no root, no change to the user's
# PipeWire config). Started and stopped by scripts/aec_pi.sh; replace MIC and SPEAKER with the node
# names from `pw-cli ls Node` (the script does this with sed).
# Result: source "va_aec_source" (microphone, echo removed) and sink "va_aec_sink" (the reference).
context.properties = {
    log.level = 2
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { nice.level = -11 } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-client-device }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            capture.props  = { node.name = "va_aec_capture"  node.passive = true target.object = "@MIC@" }
            source.props   = { node.name = "va_aec_source" }
            sink.props     = { node.name = "va_aec_sink" }
            playback.props = { node.name = "va_aec_playback" node.passive = true target.object = "@SPEAKER@" }
        }
    }
]
